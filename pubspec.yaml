name: cgpa_calculator
description: "A new Flutter project."
publish_to: 'none'
version: 0.1.0

environment:
  sdk: ^3.8.1

dependencies:
  flutter:
    sdk: flutter
  flutter_animate: ^4.5.2
  flutter_riverpod: ^3.2.1
  google_fonts: ^6.3.2
  shared_preferences: ^2.5.3
  uuid: ^4.5.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.13.1
  msix: ^3.16.13

flutter_launcher_icons:
  android: true
  ios: true
  windows:
    generate: true
    image_path: "assets/new_logo3.png" # Keep original for windows
  image_path: "assets/new_logo_final.png" # Balanced version (68% scale)
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/new_logo_final.png" # Balanced version
  min_sdk_android: 21

msix_config:
  display_name: CGPA Calculator
  publisher_display_name: Jibran Khan Dehpal
  identity_name: com.jibrankhan.cgpacalculator
  msix_version: 1.0.0.0
  logo_path: assets/new_logo3.png
  capabilities: internetClient
  install_certificate: true # Generates a self-signed certificate for local testing

flutter:
  uses-material-design: true
  assets:
    - assets/
