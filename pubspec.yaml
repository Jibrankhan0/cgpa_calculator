name: cgpa_calculator
description: "A new Flutter project."
publish_to: 'none'
version: 1.3.0+8

environment:
  sdk: ^3.8.1

dependencies:
  flutter:
    sdk: flutter
  provider: ^6.1.2
  shared_preferences: ^2.5.3
  flutter_svg: ^2.0.10+1
  google_fonts: ^8.2.1
  url_launcher: ^6.3.1
  excel: ^4.0.6
  share_plus: ^13.3.1
  path_provider: ^2.1.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.13.1
  msix: ^3.16.13

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "app_icon.png"
  min_sdk_android: 21

msix_config:
  display_name: CGPA Calculator MCKRU
  publisher_display_name: Jibran Khan Dehpal
  identity_name: com.jibrankhan.cgpacalculator
  msix_version: 1.0.0.0
  logo_path: app_icon.png
  capabilities: internetClient
  install_certificate: true # Generates a self-signed certificate for local testing

flutter:
  uses-material-design: true
  assets:
    - assets/
